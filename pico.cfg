# OpenOCD config for the main board, and the ONLY one in this repo.
#
# Pinned by adapter serial to the probe wired to the main board: with both
# bench probes attached it can never pick the video board's, and with this one
# unplugged OpenOCD fails instead of falling back to another probe.  Self-
# contained (no [find] of a sibling file), so it works from CLion's board-
# config field, flash.sh, or a bare "openocd -f pico.cfg" from any directory.

# === Interface ===
adapter serial E6647C7403512C2E         ;# the main board's probe (video board: E6633861A3266938)
adapter speed 5000
source [find interface/cmsis-dap.cfg]    ;# CMSIS-DAP probe
transport select swd                     ;# SWD interface

# === Target ===
source [find target/rp2350.cfg]          ;# RP2350 target config

# === Reset settings ===
reset_config srst_nogate                 ;# standard reset
